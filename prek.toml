# prek.toml

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [{ id = "check-yaml" }, { id = "end-of-file-fixer" }]

[[repos]]
repo = "local"
hooks = [
    { id = "go-test", name = "Go Backend Test", language = "system", entry = "go test ./...", files = '\.go$|go\.mod$', pass_filenames = false },
    { id = "web-format", name = "Frontend Format Check", language = "system", entry = "bash -c 'cd web && bun install && cd default && bun run format:check'", files = '^web/default/.*\.(js|jsx|ts|tsx|json|css|md)$|^web/package\.json$|^web/bun\.lock$', pass_filenames = false },
    { id = "web-lint", name = "Frontend Lint Check", language = "system", entry = "bash -c 'cd web && bun install && cd default && bun run lint'", files = '^web/default/.*\.(js|jsx|ts|tsx)$', pass_filenames = false },
]
